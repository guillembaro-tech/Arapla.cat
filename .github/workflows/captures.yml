name: captures
on:
  push:
    branches: [captures]
permissions:
  contents: write
jobs:
  shot:
    if: ${{ !contains(github.event.head_commit.message, '[raw]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p clips
          (which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)) > clips/log.txt 2>&1
          python tools/clip.py professordesocials https://professordesocials.cat/ >> clips/log.txt 2>&1 || true
          ls -la clips >> clips/log.txt
      - run: |
          git config user.name "claude"; git config user.email "noreply@anthropic.com"
          git add clips && git commit -m "Clip de mostra [raw]" && git push
